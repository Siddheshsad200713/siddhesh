<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Siddhesh Premium Access</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .card {
      background: #222;
      border-radius: 1rem;
      padding: 1.5rem;
      margin: 1rem auto;
      max-width: 400px;
      box-shadow: 0 0 10px #0f0;
    }
    button {
      background: #0f0;
      border: none;
      color: black;
      padding: 1rem 2rem;
      border-radius: 0.5rem;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 1rem;
    }
    .output {
      margin-top: 1rem;
      background: #000;
      padding: 1rem;
      border-radius: 0.5rem;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>🌟 Siddhesh Premium Access 🌟</h1>

  <div class="card">
    <h2>Spotify</h2>
    <button onclick="getData('spotify')">Get Access</button>
    <div id="spotify-output" class="output"></div>
  </div>

  <div class="card">
    <h2>YouTube Premium</h2>
    <button onclick="getData('youtube')">Get Access</button>
    <div id="youtube-output" class="output"></div>
  </div>

  <div class="card">
    <h2>ChatGPT</h2>
    <button onclick="getData('chatgpt')">Get Access</button>
    <div id="chatgpt-output" class="output"></div>
  </div>

  <script>
    async function getData(service) {
      const output = document.getElementById(`${service}-output`);
      output.innerHTML = '⏳ Fetching...';

      try {
        const res = await fetch(`https://siddhesh-api-backend.siddheshsadarao.repl.co/api/${service}`);
        const data = await res.json();
        output.innerHTML = `📧 Email: <b>${data.email}</b><br>🔑 Password: <b>${data.pass}</b>`;
      } catch (err) {
        output.innerHTML = '❌ Failed to load data. Please try again.';
      }
    }
  </script>
</body>
</html>
