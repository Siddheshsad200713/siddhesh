
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Siddhesh Premium Hub</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: #00ffee;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      font-size: 2.5em;
      color: #ff0099;
      margin-bottom: 10px;
    }
    .platforms {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 30px;
    }
    .card {
      background-color: #111;
      border: 2px solid #00ffee;
      border-radius: 12px;
      width: 220px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 15px #00ffee44;
      transition: all 0.3s ease-in-out;
    }
    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #00ffeeaa;
    }
    .card img {
      width: 60px;
      margin-bottom: 10px;
    }
    .card a {
      display: inline-block;
      margin-top: 10px;
      background-color: #00ffee;
      color: #000;
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🔥 Siddhesh Premium Hub 🔥</h1>
  <p>Auto access to premium accounts. Secure & dangerous 🔒💀</p>
  <div class="platforms">
    <div class="card">
      <img src="yt.png" alt="YouTube">
      <h3>YouTube Premium</h3>
      <a href="#" onclick="alert('Use the Chrome Extension to Login')">Login</a>
    </div>
    <div class="card">
      <img src="spotify.png" alt="Spotify">
      <h3>Spotify Premium</h3>
      <a href="#" onclick="alert('Use the Chrome Extension to Login')">Login</a>
    </div>
    <div class="card">
      <img src="blackbox.png" alt="Blackbox">
      <h3>Blackbox AI</h3>
      <a href="#" onclick="alert('Use the Chrome Extension to Login')">Login</a>
    </div>
    <div class="card">
      <img src="chatgpt.png" alt="ChatGPT">
      <h3>ChatGPT Premium</h3>
      <a href="#" onclick="alert('Use the Chrome Extension to Login')">Login</a>
    </div>
  </div>
</body>
</html>
